<body class="bg-[#141218] text-[#e6e0e9] h-screen w-screen overflow-hidden flex flex-col relative antialiased">

<div class="flex items-center gap-2">

<span class="font-title-lg text-title-lg font-bold text-[#d0bcff]">Recordly</span>
</div>
<div class="w-8 h-8 rounded-full bg-[#4f378b] flex items-center justify-center text-[#eaddff]">
<span class="font-label-lg text-label-lg">JD</span>
</div>
</header>
<!-- Dummy Content -->
<main class="flex-1 pt-20 px-margin-mobile">
<div class="h-32 bg-[#211f26] rounded-3xl mb-4 w-full"></div>
<div class="h-32 bg-[#211f26] rounded-3xl mb-4 w-full"></div>
<div class="h-32 bg-[#211f26] rounded-3xl mb-4 w-full"></div>
</main>

</div>
<div class="flex flex-col items-center justify-center text-[#cac4d0] px-5 py-1">
<span class="material-symbols-outlined">video_library</span>

</div>
<div class="flex flex-col items-center justify-center text-[#cac4d0] px-5 py-1">
<span class="material-symbols-outlined">settings</span>

</div>
</nav>

<!-- Drag Handle -->
<div class="w-full flex justify-center pt-4 pb-2">
<div class="w-8 h-[4px] bg-[#938f99] rounded-full"></div>
</div>
<!-- Header -->
<div class="px-margin-mobile pb-4 flex items-center justify-between">
<h2 class="font-title-lg text-title-lg text-[#e6e0e9]">Recording Options</h2>
<button aria-label="Close" class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-[#49454f] text-[#cac4d0] transition-colors">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-margin-mobile pb-24 hide-scrollbar">
<!-- Resolution Group -->
<section class="mb-6">
<h3 class="font-label-lg text-label-lg text-[#cac4d0] mb-3">Resolution</h3>
<div class="flex gap-2 overflow-x-auto hide-scrollbar pb-1">
<button class="px-4 py-2 rounded-lg border border-[#938f99] bg-transparent text-[#e6e0e9] font-label-lg text-label-lg whitespace-nowrap hover:bg-[#49454f] transition-colors">720p</button>
<button class="px-4 py-2 rounded-lg border border-[#d0bcff] bg-[#4f378b] text-[#eaddff] font-label-lg text-label-lg whitespace-nowrap transition-colors flex items-center gap-2">
<span class="material-symbols-outlined text-[18px]">check</span>
                        1080p
                    </button>
<button class="px-4 py-2 rounded-lg border border-[#938f99] bg-transparent text-[#e6e0e9] font-label-lg text-label-lg whitespace-nowrap hover:bg-[#49454f] transition-colors">1440p</button>
<button class="px-4 py-2 rounded-lg border border-[#938f99] bg-transparent text-[#e6e0e9] font-label-lg text-label-lg whitespace-nowrap hover:bg-[#49454f] transition-colors">Native</button>
</div>
</section>

</section>

<button class="w-14 h-14 rounded-full border border-[#938f99] bg-transparent text-[#e6e0e9] font-label-lg text-label-lg flex items-center justify-center hover:bg-[#49454f] transition-colors">120</button>
</div>

</label>
<label class="flex items-center justify-between p-4 border-b border-[#49454f] cursor-pointer hover:bg-[#49454f]/50 transition-colors">

<label class="flex items-center justify-between p-4 border-b border-[#49454f] cursor-pointer hover:bg-[#49454f]/50 transition-colors">
<div class="flex items-center gap-4">
