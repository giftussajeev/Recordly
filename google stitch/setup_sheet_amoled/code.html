<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Recording Setup</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9fc",
                        "inverse-primary": "#adc6ff",
                        "on-secondary-fixed-variant": "#3c4858",
                        "on-secondary-fixed": "#101c2b",
                        "on-tertiary-container": "#e6ceff",
                        "primary": "#004394",
                        "inverse-on-surface": "#f0f0f3",
                        "surface-tint": "#015ac1",
                        "tertiary-fixed": "#eedbff",
                        "primary-container": "#005ac1",
                        "tertiary-container": "#6c528c",
                        "surface-container": "#eeeef0",
                        "surface-container-high": "#e8e8ea",
                        "on-primary": "#ffffff",
                        "primary-fixed-dim": "#adc6ff",
                        "surface": "#f9f9fc",
                        "surface-container-lowest": "#ffffff",
                        "outline-variant": "#c2c6d5",
                        "surface-container-low": "#f3f3f6",
                        "on-tertiary-fixed": "#270d45",
                        "secondary-fixed": "#d7e3f8",
                        "secondary-fixed-dim": "#bbc7db",
                        "on-tertiary-fixed-variant": "#543b73",
                        "surface-variant": "#e2e2e5",
                        "on-secondary-container": "#596576",
                        "on-surface": "#1a1c1e",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#004494",
                        "on-primary-container": "#c8d8ff",
                        "on-error-container": "#93000a",
                        "primary-fixed": "#d8e2ff",
                        "tertiary": "#533a73",
                        "on-background": "#1a1c1e",
                        "on-tertiary": "#ffffff",
                        "outline": "#727784",
                        "background": "#f9f9fc",
                        "inverse-surface": "#2f3133",
                        "on-primary-fixed": "#001a41",
                        "error-container": "#ffdad6",
                        "secondary": "#535f70",
                        "on-secondary": "#ffffff",
                        "secondary-container": "#d7e3f8",
                        "on-surface-variant": "#424753",
                        "surface-dim": "#dadadc",
                        "tertiary-fixed-dim": "#d8bafc",
                        "surface-container-highest": "#e2e2e5",
                        // Absolute dark overrides for specific contexts if needed, though relying on theme configuration is better.
                        "absolute-dark": "#000000",
                        "absolute-surface": "#1A1C1E"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "base": "8px",
                        "xs": "4px",
                        "lg": "24px",
                        "margin-desktop": "24px",
                        "md": "16px",
                        "xl": "32px",
                        "margin-mobile": "16px",
                        "gutter": "16px",
                        "sm": "8px",
                        "safe": "env(safe-area-inset-bottom)"
                    },
                    "fontFamily": {
                        "title-lg": ["Roboto Flex"],
                        "label-md": ["Roboto Flex"],
                        "display-lg": ["Roboto Flex"],
                        "headline-lg-mobile": ["Roboto Flex"],
                        "body-lg": ["Roboto Flex"],
                        "body-md": ["Roboto Flex"],
                        "headline-lg": ["Roboto Flex"],
                        "metadata-sm": ["Roboto Flex"]
                    },
                    "fontSize": {
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "label-md": ["12px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],
                        "display-lg": ["57px", { "lineHeight": "64px", "letterSpacing": "-0.25px", "fontWeight": "400" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "400" }],
                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }],
                        "body-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.25px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "400" }],
                        "metadata-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.4px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { background-color: #000000; color: #e2e2e5; }
        /* Custom scrollbar for absolute dark */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #2f3133; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #424753; }
        
        /* Modal bottom sheet animation */
        @keyframes slideUp {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .bottom-sheet { animation: slideUp 0.3s cubic-bezier(0.2, 0, 0, 1); }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-end bg-black">
<!-- Backdrop (Implicitly dark context) -->
<div class="absolute inset-0 bg-black/60 backdrop-blur-sm z-40"></div>
<!-- Bottom Sheet Container (Absolute Dark #000000 with Level 1 Surface #1A1C1E elements) -->
<div class="bottom-sheet relative z-50 w-full max-w-2xl mx-auto bg-black rounded-t-xl border-t border-[#2C2E33] flex flex-col max-h-[795px]">
<!-- Drag Handle & Header -->
<div class="flex flex-col items-center pt-md pb-xs px-margin-mobile sticky top-0 bg-black z-10 border-b border-[#2C2E33]/50">
<div class="w-12 h-1 bg-[#2C2E33] rounded-full mb-md"></div>
<div class="w-full flex justify-between items-center">
<h2 class="font-title-lg text-title-lg text-surface-bright">Recording Setup</h2>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-[#1A1C1E] transition-colors text-outline-variant">
<span class="material-symbols-outlined text-[20px]">close</span>
</button>
</div>
</div>
<!-- Scrollable Content -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-lg space-y-xl">
<!-- Resolution -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-body-md text-body-md text-outline-variant">Resolution</label>
<span class="font-label-md text-label-md text-primary-fixed-dim">1080p</span>
</div>
<div class="grid grid-cols-4 gap-xs">
<button class="py-2 px-1 rounded-DEFAULT bg-[#1A1C1E] hover:bg-[#2f3133] border border-[#2C2E33] font-body-md text-body-md text-surface-dim transition-colors">720p</button>
<button class="py-2 px-1 rounded-DEFAULT bg-primary-fixed text-on-primary-fixed font-body-md text-body-md font-medium transition-colors">1080p</button>
<button class="py-2 px-1 rounded-DEFAULT bg-[#1A1C1E] hover:bg-[#2f3133] border border-[#2C2E33] font-body-md text-body-md text-surface-dim transition-colors">1440p</button>
<button class="py-2 px-1 rounded-DEFAULT bg-[#1A1C1E] hover:bg-[#2f3133] border border-[#2C2E33] font-body-md text-body-md text-surface-dim transition-colors">Native</button>
</div>
</div>
<!-- Quality -->
<div class="space-y-sm">
<div class="flex justify-between items-end">
<label class="font-body-md text-body-md text-outline-variant">Quality</label>
<span class="font-label-md text-label-md text-primary-fixed-dim">High</span>
</div>
<div class="grid grid-cols-4 gap-xs">
<button class="py-2 px-1 rounded-DEFAULT bg-[#1A1C1E] hover:bg-[#2f3133] border border-[#2C2E33] font-body-md text-body-md text-surface-dim transition-colors">Low</button>
<button class="py-2 px-1 rounded-DEFAULT bg-[#1A1C1E] hover:bg-[#2f3133] border border-[#2C2E33] font-body-md text-body-md text-surface-dim transition-colors">Balanced</button>
<button class="py-2 px-1 rounded-DEFAULT bg-primary-fixed text-on-primary-fixed font-body-md text-body-md font-medium transition-colors">High</button>
<button class="py-2 px-1 rounded-DEFAULT bg-[#1A1C1E] hover:bg-[#2f3133] border border-[#2C2E33] font-body-md text-body-md text-surface-dim transition-colors">Max</button>
</div>
</div>
<!-- Bitrate / FPS Sliders (Simulated) -->
<div class="space-y-lg p-md bg-[#1A1C1E] rounded-lg border border-[#2C2E33]">
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-body-md text-body-md text-surface-bright">Frame Rate (FPS)</label>
<span class="font-label-md text-label-md px-2 py-1 bg-[#2f3133] rounded-sm text-surface-bright">60 FPS</span>
</div>
<div class="relative w-full h-2 bg-[#2f3133] rounded-full mt-sm">
<div class="absolute top-0 left-0 h-full w-[60%] bg-primary-fixed-dim rounded-full"></div>
<div class="absolute top-1/2 left-[60%] -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-primary-fixed rounded-full shadow-lg border-2 border-black"></div>
</div>
<div class="flex justify-between font-metadata-sm text-metadata-sm text-outline mt-1">
<span>24</span>
<span>120</span>
</div>
</div>
<div class="space-y-sm">
<div class="flex justify-between items-center">
<label class="font-body-md text-body-md text-surface-bright">Bitrate (Mbps)</label>
<span class="font-label-md text-label-md px-2 py-1 bg-[#2f3133] rounded-sm text-surface-bright">24 Mbps</span>
</div>
<div class="relative w-full h-2 bg-[#2f3133] rounded-full mt-sm">
<div class="absolute top-0 left-0 h-full w-[45%] bg-primary-fixed-dim rounded-full"></div>
<div class="absolute top-1/2 left-[45%] -translate-x-1/2 -translate-y-1/2 w-4 h-4 bg-primary-fixed rounded-full shadow-lg border-2 border-black"></div>
</div>
<div class="flex justify-between font-metadata-sm text-metadata-sm text-outline mt-1">
<span>Auto</span>
<span>100</span>
</div>
</div>
</div>
<!-- Helper Text -->
<div class="flex items-start space-x-sm bg-error-container/10 p-md rounded-lg border border-error-container/20">
<span class="material-symbols-outlined text-[18px] text-error-container mt-0.5">warning</span>
<p class="font-metadata-sm text-metadata-sm text-surface-dim leading-relaxed">
                    Higher FPS and bitrate may significantly increase file size, battery usage, and device heat generation during prolonged recording sessions.
                </p>
</div>
<!-- Audio Source -->
<div class="space-y-sm">
<label class="font-body-md text-body-md text-outline-variant">Audio Source</label>
<div class="flex flex-col space-y-xs">
<label class="flex items-center justify-between p-md rounded-lg bg-[#1A1C1E] border border-primary-fixed cursor-pointer">
<div class="flex items-center space-x-md">
<div class="w-8 h-8 rounded-full bg-primary-fixed/20 flex items-center justify-center text-primary-fixed">
<span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
<div>
<p class="font-body-md text-body-md text-surface-bright">Internal Mic</p>
<p class="font-metadata-sm text-metadata-sm text-outline">Stereo, 48kHz</p>
</div>
</div>
<div class="w-5 h-5 rounded-full border-2 border-primary-fixed flex items-center justify-center">
<div class="w-2.5 h-2.5 bg-primary-fixed rounded-full"></div>
</div>
</label>
<label class="flex items-center justify-between p-md rounded-lg bg-black hover:bg-[#1A1C1E] border border-[#2C2E33] cursor-pointer transition-colors">
<div class="flex items-center space-x-md">
<div class="w-8 h-8 rounded-full bg-[#2f3133] flex items-center justify-center text-outline-variant">
<span class="material-symbols-outlined text-[18px]">bluetooth_audio</span>
</div>
<div>
<p class="font-body-md text-body-md text-surface-dim">External Bluetooth</p>
<p class="font-metadata-sm text-metadata-sm text-outline">Disconnected</p>
</div>
</div>
<div class="w-5 h-5 rounded-full border-2 border-[#2f3133]"></div>
</label>
<label class="flex items-center justify-between p-md rounded-lg bg-black hover:bg-[#1A1C1E] border border-[#2C2E33] cursor-pointer transition-colors">
<div class="flex items-center space-x-md">
<div class="w-8 h-8 rounded-full bg-[#2f3133] flex items-center justify-center text-outline-variant">
<span class="material-symbols-outlined text-[18px]">volume_off</span>
</div>
<div>
<p class="font-body-md text-body-md text-surface-dim">Mute</p>
<p class="font-metadata-sm text-metadata-sm text-outline">Video only</p>
</div>
</div>
<div class="w-5 h-5 rounded-full border-2 border-[#2f3133]"></div>
</label>
</div>
</div>
</div>
<!-- Sticky Footer Actions -->
<div class="p-margin-mobile border-t border-[#2C2E33]/50 bg-black sticky bottom-0 z-10 flex gap-md pb-[calc(16px+env(safe-area-inset-bottom))]">
<button class="flex-1 py-3 px-4 rounded-full border border-[#2C2E33] font-label-md text-label-md text-surface-bright hover:bg-[#1A1C1E] transition-colors flex items-center justify-center space-x-2">
<span class="material-symbols-outlined text-[18px]">bookmark_add</span>
<span>Save as preset</span>
</button>
<button class="flex-1 py-3 px-4 rounded-full bg-primary-fixed text-on-primary-fixed font-label-md text-label-md hover:bg-primary-fixed-dim transition-colors">
                Apply Settings
            </button>
</div>
</div>
</body></html>
